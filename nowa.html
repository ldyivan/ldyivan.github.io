<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>挪瓦咖啡 SOP 查询工具</title>
<style>
:root{
  --yellow:#FFD400;
  --yellow-deep:#F5B800;
  --ink:#1A1A1A;
  --bg:#F7F3E8;
  --card:#FFFFFF;
  --gray:#8C8C8C;
  --line:#EFE9D8;
  --ice-bg:#E7F3F7; --ice-tx:#13728A;
  --hot-bg:#FDEBDD; --hot-tx:#C2571A;
  --shadow:0 2px 12px rgba(26,26,26,.06);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{max-width:100%;overflow-x:hidden;}
html{font-size:16px;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.6;
  padding-bottom:86px;
}

/* Header */
.header{
  background:linear-gradient(135deg,#FFD400 0%,#FFC300 100%);
  padding:16px 16px 14px;color:var(--ink);position:sticky;top:0;z-index:20;
}
.header-top{display:flex;align-items:center;gap:11px;}
.logo{
  width:40px;height:40px;background:var(--ink);border-radius:11px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;color:var(--yellow);
  font-weight:900;font-size:22px;line-height:1;
}
.header h1{font-size:20px;font-weight:800;letter-spacing:1px;line-height:1.2;}
.header .sub{font-size:11.5px;font-weight:500;opacity:.75;margin-top:1px;letter-spacing:1px;}

/* Search */
.search{
  margin:10px 14px 0;background:var(--card);border-radius:12px;display:flex;align-items:center;
  padding:0 12px;height:42px;box-shadow:var(--shadow);
}
.search svg{width:18px;height:18px;fill:#B8B2A0;flex:0 0 auto;}
.search input{border:none;outline:none;flex:1;margin-left:8px;font-size:15px;background:transparent;color:var(--ink);min-width:0;}
.search input::placeholder{color:#C4BEA8;}

/* Filter */
.filter{margin:10px 14px 0;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:11px 12px;}
.f-row{display:flex;align-items:center;gap:8px;}
.f-row + .f-row{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);}
.f-label{flex:0 0 auto;font-size:12px;font-weight:700;color:#9A937E;width:34px;}
.chips{display:flex;gap:7px;overflow-x:auto;flex:1;scrollbar-width:none;padding:1px;}
.chips::-webkit-scrollbar{display:none;}
.chips.scroll-mask{-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent);}
.chip{
  flex:0 0 auto;padding:6px 13px;border-radius:999px;font-size:13px;font-weight:600;
  background:#F5F1E5;color:#6B6757;border:1px solid transparent;cursor:pointer;white-space:nowrap;
  transition:all .16s;
}
.chip.active{background:var(--ink);color:var(--yellow);border-color:var(--ink);}

/* Section */
.main{padding:6px 14px 20px;}
.sec-title{font-size:13px;color:var(--gray);margin:14px 2px 8px;font-weight:600;letter-spacing:1px;}

/* Product Card */
.card{
  background:var(--card);border-radius:16px;box-shadow:var(--shadow);margin-bottom:12px;
  overflow:hidden;cursor:pointer;width:100%;
}
.card-head{padding:14px 15px;}
.card-main{display:flex;flex-direction:column;gap:8px;}
.card-title{font-size:16px;font-weight:700;line-height:1.35;word-break:break-all;}
.card-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.badge{font-size:11px;padding:2px 9px;border-radius:999px;font-weight:600;background:#FFF6D6;color:#9A7B00;border:1px solid #FFE78A;}
.badge.new{background:#E9F7EE;color:#1E8A4C;border-color:#BFE8CF;}
.badge.retire{background:#F2F0EC;color:#8C8C8C;border-color:#E2DED2;}
.ctag{font-size:11px;padding:2px 8px;border-radius:7px;font-weight:600;}
.ctag.ice{background:var(--ice-bg);color:var(--ice-tx);}
.ctag.hot{background:var(--hot-bg);color:var(--hot-tx);}
.arrow{width:16px;height:16px;transition:transform .2s;fill:#B8B2A0;flex:0 0 auto;align-self:center;}
.head-row{display:flex;align-items:flex-start;gap:8px;}
.head-row .card-main{flex:1;min-width:0;}

/* Specs */
.specs{display:none;border-top:1px solid var(--line);padding:8px 14px 15px;}
.card.open .specs{display:block;}
.card.open .arrow{transform:rotate(90deg);}
.spec{margin-top:10px;background:#FFFDF4;border:1px solid var(--line);border-radius:12px;padding:12px 13px;}
.spec:first-child{margin-top:0;}
.spec-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.cup{font-size:13px;font-weight:700;}
.tag{font-size:11px;padding:1px 8px;border-radius:6px;font-weight:700;}
.tag.ice{background:var(--ice-bg);color:var(--ice-tx);}
.tag.hot{background:var(--hot-bg);color:var(--hot-tx);}
.steps{list-style:none;}
.steps li{position:relative;padding-left:26px;font-size:14px;color:#3A372F;margin-top:9px;line-height:1.7;word-break:break-all;}
.steps li:first-child{margin-top:0;}
.steps li::before{
  content:attr(data-i);position:absolute;left:0;top:2px;width:18px;height:18px;border-radius:50%;
  background:var(--yellow);color:var(--ink);font-size:10.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
}

/* Material / Tools rows */
.row{background:var(--card);border-radius:14px;box-shadow:var(--shadow);margin-bottom:10px;padding:13px 15px;}
.row-name{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;word-break:break-all;}
.row-name .tag{font-size:10px;}
.kv{display:flex;flex-wrap:wrap;gap:5px 14px;margin-top:8px;font-size:12.5px;color:#5A5648;}
.kv span b{color:#8C8C8C;font-weight:600;margin-right:3px;}

/* Terms */
.term{padding:12px 15px;}
.term .k{font-size:14.5px;font-weight:700;color:var(--ink);word-break:break-all;}
.term .v{font-size:13px;color:#5A5648;margin-top:4px;word-break:break-all;}

/* Button cards */
.btn-card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden;}
.btn-item{padding:11px 15px;}
.btn-item.old{background:#FFFDF4;border-bottom:1px solid var(--line);}
.btn-item.new{background:#FFFBE8;}
.btn-item.deprecated{background:#F6F4EE;color:#9A9584;}
.btn-item.new-only{background:#FFFBE8;}
.btn-name{font-size:15px;font-weight:800;}
.btn-item.deprecated .btn-name{color:#B0AA97;font-weight:600;}
.btn-meta{font-size:12px;color:#8C8C8C;margin-top:2px;}
.btn-arrow{text-align:center;background:var(--bg);color:#B0AA97;font-size:13px;line-height:1;padding:5px 0;}
.note{font-size:12px;color:var(--gray);line-height:1.7;padding:4px 2px;word-break:break-all;}

/* Tabbar */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom);
}
.tabbar .tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;
  font-size:10.5px;color:#9A9584;cursor:pointer;font-weight:600;
}
.tabbar .tab svg{width:22px;height:22px;fill:#9A9584;}
.tabbar .tab.active{color:var(--ink);}
.tabbar .tab.active svg{fill:var(--ink);}

.hidden{display:none!important;}
.empty{text-align:center;color:var(--gray);font-size:14px;padding:40px 0;}
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <div class="logo">N</div>
    <div>
      <h1>挪瓦咖啡</h1>
      <div class="sub">饮品制作 SOP 查询工具</div>
    </div>
  </div>

<div class="search">

  <section id="tab-tools" class="hidden">

const DRINKS = [].concat(DATA.longterm, DATA.season, DATA.retire, DATA.oldLongterm, DATA.oldSeason);

const SERIES = ["美式/果咖系列","拿铁系列","非咖系列","当季新品","汰换品","旧版长期品","旧版当季品"];
const SERIES_LABEL = {"美式/果咖系列":"美式果咖","拿铁系列":"拿铁","非咖系列":"非咖","当季新品":"当季新品","汰换品":"汰换品","旧版长期品":"旧版长期品","旧版当季品":"旧版当季品"};
const CUPS = ["标准杯","吨吨桶","超大杯"];
const TEMPS = ["冰","热"];

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(v){if(v===null||v===undefined||v==='')return '—';return String(parseFloat(v));}

function badgeOf(series){
  if(series==="当季新品") return '<span class="badge new">新品</span>';
  if(series==="汰换品") return '<span class="badge retire">售完即止</span>';
  if(series==="旧版长期品"||series==="旧版当季品") return '<span class="badge retire">旧版</span>';
  return '<span class="badge">'+SERIES_LABEL[series]+'</span>';
}

function splitSteps(s){
  const steps=[];let buf='';let depth=0;
  for(let i=0;i<s.length;i++){
    const ch=s[i];
    if(ch==='（'||ch==='('){depth++;buf+=ch;}
    else if(ch==='）'||ch===')'){depth=Math.max(0,depth-1);buf+=ch;}
    else if(ch==='+'&&depth===0){const t=buf.trim();if(t)steps.push(t);buf='';}
    else{buf+=ch;}
  }
  const t=buf.trim();if(t)steps.push(t);
  return steps;
}

function tagOf(temp){return temp==='热'?'<span class="tag hot">热</span>':'<span class="tag ice">冰</span>';}

function specHTML(spec){
  const steps = splitSteps(spec.step).map((st,i)=>'<li data-i="'+(i+1)+'">'+esc(st)+'</li>').join('');
  return '<div class="spec">'+
    '<div class="spec-top"><span class="cup">'+esc(spec.cup)+'</span>'+tagOf(spec.temp)+'</div>'+
    '<ol class="steps">'+steps+'</ol>'+
  '</div>';
}

function ctagHTML(s){
  const cls = s.temp==='热'?'ctag hot':'ctag ice';
  return '<span class="'+cls+'">'+esc(s.cup)+'·'+esc(s.temp)+'</span>';
}

function productCard(p){
  const specs = p.specs.map(specHTML).join('');
  const tags = badgeOf(p.series) + p.specs.map(ctagHTML).join('');
  return '<div class="card">'+
    '<div class="card-head"><div class="head-row">'+
      '<div class="card-main">'+
        '<div class="card-title">'+esc(p.name)+'</div>'+
        '<div class="card-tags">'+tags+'</div>'+
      '</div>'+
      '<svg class="arrow" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6z"/></svg>'+
    '</div></div>'+
    '<div class="specs">'+specs+'</div>'+
  '</div>';
}

let curSeries='全部', curCup='全部', curTemp='全部', curKeyword='';

function renderChips(){
  const seriesChips = ['全部'].concat(SERIES).map(c=>
    '<div class="chip'+(curSeries===c?' active':'')+'" data-f="'+esc(c)+'">'+(c==='全部'?'全部':SERIES_LABEL[c])+'</div>').join('');
  document.getElementById('chips-series').innerHTML = seriesChips;
  const cupChips = ['全部'].concat(CUPS).map(c=>
    '<div class="chip'+(curCup===c?' active':'')+'" data-cup="'+esc(c)+'">'+c+'</div>').join('');
  document.getElementById('chips-cup').innerHTML = cupChips;
  const tempChips = ['全部'].concat(TEMPS).map(c=>
    '<div class="chip'+(curTemp===c?' active':'')+'" data-temp="'+esc(c)+'">'+c+'</div>').join('');
  document.getElementById('chips-temp').innerHTML = tempChips;
}

function renderDrinks(){
  const list = [];
  DRINKS.forEach(p=>{
    if(curSeries!=='全部' && p.series!==curSeries) return;
    if(curKeyword && !p.name.toLowerCase().includes(curKeyword)) return;
    const specs = p.specs.filter(s=>{
      if(curCup!=='全部' && s.cup!==curCup) return false;
      if(curTemp!=='全部' && s.temp!==curTemp) return false;
      return true;
    });
    if(specs.length===0) return;
    list.push({name:p.name, series:p.series, specs:specs});
  });
  document.getElementById('drinks').innerHTML = list.map(productCard).join('');
  document.getElementById('empty').classList.toggle('hidden', list.length>0);
}

function renderMaterials(){
  document.getElementById('materials').innerHTML = DATA.materials.map(m=>{
    const fields = [
      ['简写', m.abbr],['规格', m.spec],['整箱', m.box],['订购', m.order],
      ['开封前', (m.preEnv+' · '+m.preTime).replace(/^ · | · $/g,'')],
      ['开封后', (m.postEnv+' · '+m.postTime).replace(/^ · | · $/g,'')],
    ].filter(f=>f[1] && f[1]!=='/');
    return '<div class="row">'+
      '<div class="row-name">'+esc(m.name)+'<span class="tag ice">'+esc(m.type)+'</span></div>'+
      '<div class="kv">'+fields.map(f=>'<span><b>'+f[0]+'</b>'+esc(f[1])+'</span>').join('')+'</div>'+
    '</div>';
  }).join('');
}

function renderTerms(){
  document.getElementById('terms').innerHTML = DATA.terms.map(t=>
    '<div class="row term"><div class="k">'+esc(t.k)+'</div><div class="v">'+esc(t.v)+'</div></div>'
  ).join('');
}

function renderButtons(){
  document.getElementById('buttons').innerHTML = DATA.buttons.map(b=>{
    const hasOld = !!b.old;
    const hasNew = !!b.new && b.new!=='-';
    const oldBlock = hasOld
      ? '<div class="btn-item old"><div class="btn-name">'+esc(b.old)+'</div><div class="btn-meta">咖啡豆 '+fmt(b.oldBean)+'g · 咖啡液 '+fmt(b.oldLiq)+'ml</div></div>'
      : '<div class="btn-item old" style="color:#9A9584;"><div class="btn-name" style="font-weight:600;">（无对应旧按键）</div></div>';
    const newBlock = hasNew
      ? '<div class="btn-item new"><div class="btn-name">'+esc(b.new)+'</div><div class="btn-meta">咖啡豆 '+fmt(b.newBean)+'g · 咖啡液 '+fmt(b.newLiq)+'ml</div></div>'
      : '<div class="btn-item deprecated"><div class="btn-name">已停用</div><div class="btn-meta">该按键不再使用</div></div>';
    return '<div class="btn-card">'+oldBlock+'<div class="btn-arrow">▼ 变更后</div>'+newBlock+'</div>';
  }).join('') +
  '<div class="note">说明：若门店咖啡机按键未更新，请按上表变更前后对应关系进行产品制作。吨吨桶风味 / 吨吨桶拿铁 / 吨吨桶美式为新增按键，无旧按键对应。</div>';
}

function renderTools(){
  document.getElementById('tools').innerHTML = DATA.tools.map(t=>
    '<div class="row"><div class="row-name">'+esc(t.name)+'</div>'+
    '<div class="kv"><span><b>用途</b>'+esc(t.use)+'</span></div></div>'
  ).join('');
}

function switchTab(tab){
  ['drinks','material','terms','buttons','tools'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('hidden', t!==tab);
  });
  document.querySelectorAll('#tabbar .tab').forEach(el=>{
    el.classList.toggle('active', el.dataset.tab===tab);
  });
  document.querySelector('.search').style.display = (tab==='drinks')?'flex':'none';
  document.querySelector('.filter').style.display = (tab==='drinks')?'block':'none';
  window.scrollTo(0,0);
}

document.getElementById('search').addEventListener('input', function(e){
  curKeyword = e.target.value.trim().toLowerCase();
  renderDrinks();
});

document.getElementById('chips-series').addEventListener('click', function(e){
  const chip = e.target.closest('.chip'); if(!chip) return;
  curSeries = chip.dataset.f; renderChips(); renderDrinks();
});
document.getElementById('chips-cup').addEventListener('click', function(e){
  const chip = e.target.closest('.chip'); if(!chip) return;
  curCup = chip.dataset.cup; renderChips(); renderDrinks();
});
document.getElementById('chips-temp').addEventListener('click', function(e){
  const chip = e.target.closest('.chip'); if(!chip) return;
  curTemp = chip.dataset.temp; renderChips(); renderDrinks();
});

document.getElementById('drinks').addEventListener('click', function(e){
  const card = e.target.closest('.card');
  if(!card) return;
  card.classList.toggle('open');
});

document.getElementById('tabbar').addEventListener('click', function(e){
  const tab = e.target.closest('.tab');
  if(!tab) return;
  switchTab(tab.dataset.tab);
