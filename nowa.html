<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FFD400">
<title>挪瓦咖啡 SOP 查询工具</title>
<style>
:root{
  --yellow:#FFD400;
  --yellow-deep:#F2B800;
  --yellow-soft:#FFF6D6;
  --ink:#1A1A1A;
  --bg:#F6F1E4;
  --card:#FFFFFF;
  --gray:#8C8C8C;
  --line:rgba(26,26,26,.08);
  --ice-bg:#E6F3F7; --ice-tx:#12718C;
  --hot-bg:#FCEBDE; --hot-tx:#C25A1C;
  --shadow:0 6px 20px rgba(26,26,26,.07);
  --shadow-lg:0 12px 30px rgba(26,26,26,.12);
  --r:18px;
  --ease:cubic-bezier(.22,.9,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{max-width:100%;overflow-x:hidden;}
html{font-size:16px;-webkit-text-size-adjust:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.6;
  padding-bottom:92px;
  min-height:100vh;
}

/* ambient background glow */
.bg-glow{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.bg-glow::before,.bg-glow::after{content:"";position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;}
.bg-glow::before{width:340px;height:340px;background:#FFE27A;top:-120px;left:-90px;animation:drift1 14s ease-in-out infinite alternate;}
.bg-glow::after{width:300px;height:300px;background:#FFD9A8;bottom:-100px;right:-80px;animation:drift2 18s ease-in-out infinite alternate;}
@keyframes drift1{to{transform:translate(60px,50px) scale(1.15);}}
@keyframes drift2{to{transform:translate(-50px,-40px) scale(.9);}}

/* Header */
.header{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(135deg,#FFE066 0%,#FFD400 45%,#F2B800 100%);
  padding:14px 16px 13px;color:var(--ink);
  box-shadow:0 4px 16px rgba(242,184,0,.35);
}
.header::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,0) 28%);}
.header-top{position:relative;display:flex;align-items:center;gap:11px;}
.logo{
  width:42px;height:42px;background:var(--ink);border-radius:12px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;color:var(--yellow);
  font-weight:900;font-size:23px;line-height:1;letter-spacing:-1px;
  animation:logoPop .6s var(--ease) both;
}
@keyframes logoPop{0%{transform:scale(.5) rotate(-12deg);opacity:0;}100%{transform:scale(1) rotate(0);opacity:1;}}
.header h1{font-size:20px;font-weight:800;letter-spacing:1px;line-height:1.15;}
.header .sub{font-size:11.5px;font-weight:600;opacity:.7;margin-top:1px;letter-spacing:1.5px;}

/* Search */
.search{
  margin:12px 14px 0;background:var(--card);border-radius:14px;display:flex;align-items:center;
  padding:0 13px;height:46px;box-shadow:var(--shadow);
  transition:box-shadow .25s ease,transform .25s ease;border:1.5px solid transparent;
}
.search:focus-within{border-color:var(--yellow);box-shadow:0 0 0 4px rgba(255,212,0,.22),var(--shadow-lg);transform:translateY(-1px);}
.search svg{width:19px;height:19px;fill:#ADA68F;flex:0 0 auto;transition:fill .25s;}
.search:focus-within svg{fill:var(--ink);}
.search input{border:none;outline:none;flex:1;margin-left:9px;font-size:15.5px;background:transparent;color:var(--ink);min-width:0;}
.search input::placeholder{color:#C7C1AB;}
.search .clean-btn{display:none;flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:#F0ECE0;color:#8C8C8C;border:none;font-size:13px;line-height:1;cursor:pointer;align-items:center;justify-content:center;}
.search .clean-btn.show{display:flex;}

/* Filter */
.filter{margin:10px 14px 0;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px 13px;animation:fadeUp .5s var(--ease) .08s both;}
.f-row{display:flex;align-items:center;gap:8px;}
.f-row + .f-row{margin-top:10px;padding-top:10px;border-top:1px dashed rgba(26,26,26,.09);}
.f-label{flex:0 0 auto;font-size:12px;font-weight:800;color:#A79F86;width:36px;letter-spacing:1px;}
.chips{display:flex;gap:7px;overflow-x:auto;flex:1;scrollbar-width:none;padding:2px 1px;-webkit-overflow-scrolling:touch;}
.chips::-webkit-scrollbar{display:none;}
.chips.scroll-mask{-webkit-mask-image:linear-gradient(90deg,#000 90%,transparent);mask-image:linear-gradient(90deg,#000 90%,transparent);}
.chip{
  position:relative;flex:0 0 auto;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;
  background:#F6F2E6;color:#6B6655;border:1px solid transparent;cursor:pointer;white-space:nowrap;
  transition:background .2s,color .2s,transform .18s var(--ease),box-shadow .2s;overflow:hidden;user-select:none;
}
.chip:active{transform:scale(.92);}
.chip.active{background:var(--ink);color:var(--yellow);box-shadow:0 4px 12px rgba(26,26,26,.25);}
.chip .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:ripple .55s ease-out forwards;pointer-events:none;}
.chip.active .ripple{background:rgba(255,212,0,.5);}
@keyframes ripple{to{transform:scale(3);opacity:0;}}

/* Main */
.main{position:relative;z-index:1;padding:8px 14px 22px;}
.sec-title{font-size:13px;color:var(--gray);margin:16px 2px 8px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:6px;}
.sec-title::before{content:"";width:4px;height:14px;border-radius:3px;background:var(--yellow);}

/* Result bar */
.result-bar{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 10px;color:var(--gray);font-size:12px;font-weight:600;gap:10px;}
.result-bar .cnt{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap;}
.result-bar .cnt b{color:var(--ink);font-size:14px;}
.col-switch{display:flex;background:#F0E9DA;border-radius:999px;padding:2px;gap:1px;flex:0 0 auto;box-shadow:inset 0 1px 3px rgba(26,26,26,.06);}
.col-switch button{border:none;background:transparent;font-size:11px;font-weight:800;color:#A8A28D;padding:5px 9px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s;line-height:1;font-family:inherit;}
.col-switch button:active{transform:scale(.92);}
.col-switch button.active{background:var(--ink);color:var(--yellow);box-shadow:0 2px 6px rgba(26,26,26,.25);}

/* Product Grid */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
#drinks{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:10px;}
.card{
  background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  overflow:hidden;cursor:pointer;width:100%;min-width:0;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:13px 12px 11px;
  opacity:0;transform:translateY(14px);
  transition:opacity .45s var(--ease),transform .45s var(--ease),box-shadow .25s ease;
  will-change:transform,opacity;
  contain:layout;
}
.card.in{opacity:1;transform:translateY(0);}
.card.pressed{transform:scale(.97);box-shadow:var(--shadow-lg);}
.card:active{transform:scale(.97);}
.card-title{font-size:14.5px;font-weight:800;line-height:1.32;word-break:break-all;}
.card-title mark{background:linear-gradient(transparent 55%,#FFE066 55%);color:inherit;padding:0 2px;border-radius:3px;font-weight:inherit;}
.card-tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:7px;}
.card-sub{display:flex;flex-direction:column;align-items:flex-start;gap:5px;margin-top:9px;font-size:11px;color:#8C8C8C;font-weight:600;word-break:break-all;line-height:1.4;}
.card-sub .temps{display:inline-flex;gap:4px;flex-wrap:wrap;}
.badge{font-size:10px;padding:1.5px 8px;border-radius:999px;font-weight:700;background:var(--yellow-soft);color:#8F7300;border:1px solid #FFE078;}
.badge.new{background:#E9F7EE;color:#1E8A4C;border-color:#BFE8CF;animation:pulse 2.4s ease-in-out infinite;}
.badge.retire{background:#F3F1EB;color:#8C8C8C;border-color:#E4E0D3;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(30,138,76,.25);}50%{box-shadow:0 0 0 5px rgba(30,138,76,0);}}
.ctag{font-size:10px;padding:2px 7px;border-radius:7px;font-weight:700;display:inline-flex;align-items:center;gap:3px;}
.ctag.ice{background:var(--ice-bg);color:var(--ice-tx);}
.ctag.hot{background:var(--hot-bg);color:var(--hot-tx);}

/* Specs (inside modal) */
.spec{background:#FFFDF3;border:1px solid var(--line);border-radius:13px;padding:12px 13px;margin-top:12px;}
.spec:first-child{margin-top:0;}
.spec-top{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
.cup{font-size:13.5px;font-weight:800;display:inline-flex;align-items:center;gap:5px;}
.tag{font-size:11px;padding:2px 9px;border-radius:7px;font-weight:800;}
.tag.ice{background:var(--ice-bg);color:var(--ice-tx);}
.tag.hot{background:var(--hot-bg);color:var(--hot-tx);}
.steps{list-style:none;}
.steps li{position:relative;padding-left:28px;font-size:14px;color:#3A372F;margin-top:9px;line-height:1.7;word-break:break-all;}
.steps li:first-child{margin-top:0;}
.steps li::before{
  content:attr(data-i);position:absolute;left:0;top:2px;width:19px;height:19px;border-radius:50%;
  background:var(--yellow);color:var(--ink);font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 5px rgba(242,184,0,.4);
}

/* Material / Tools rows */
.row{background:var(--card);border-radius:15px;box-shadow:var(--shadow);margin-bottom:10px;padding:14px 16px;animation:fadeUp .5s var(--ease) both;contain:layout;}
.row-name{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap;word-break:break-all;}
.row-name .tag{font-size:10px;}
.kv{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:9px;font-size:12.5px;color:#5A5648;}
.kv span b{color:var(--gray);font-weight:700;margin-right:3px;}

/* Terms */
.term{padding:13px 16px;}
.term .k{font-size:14.5px;font-weight:800;color:var(--ink);word-break:break-all;display:flex;align-items:center;gap:7px;}
.term .k::before{content:"";width:8px;height:8px;border-radius:3px;background:var(--yellow);flex:0 0 auto;}
.term .v{font-size:13px;color:#5A5648;margin-top:5px;word-break:break-all;padding-left:15px;border-left:2px solid #F0E9D4;}

/* Button cards */
.btn-card{background:var(--card);border-radius:15px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden;animation:fadeUp .5s var(--ease) both;}
.btn-item{padding:12px 16px;}
.btn-item.old{background:#FFFDF3;border-bottom:1px solid var(--line);}
.btn-item.new{background:#FFF9E0;}
.btn-item.deprecated{background:#F6F4EE;color:#9A9584;}
.btn-item.new-only{background:#FFF9E0;}
.btn-name{font-size:15px;font-weight:800;}
.btn-item.deprecated .btn-name{color:#B0AA97;font-weight:600;}
.btn-meta{font-size:12px;color:var(--gray);margin-top:2px;}
.btn-arrow{text-align:center;background:var(--bg);color:#B0AA97;font-size:12px;line-height:1;padding:7px 0;font-weight:700;letter-spacing:1px;}
.note{font-size:12px;color:var(--gray);line-height:1.7;padding:6px 2px;word-break:break-all;}

/* Empty */
.empty{text-align:center;color:var(--gray);padding:52px 20px;animation:fadeUp .5s var(--ease) both;}
.empty svg{width:74px;height:74px;fill:#E6E0CE;margin-bottom:14px;}
.empty .t{font-size:15px;font-weight:800;color:#8C876F;}
.empty .d{font-size:12.5px;margin-top:5px;color:#BBB49F;}
.empty button{margin-top:16px;padding:9px 22px;border-radius:999px;border:none;background:var(--ink);color:var(--yellow);font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 5px 14px rgba(26,26,26,.22);transition:transform .18s var(--ease);}
.empty button:active{transform:scale(.94);}

/* Tabbar */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -6px 20px rgba(26,26,26,.06);
}
.tabbar::before{content:"";position:absolute;top:-1px;left:0;right:0;height:1px;}
.tabbar .tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;
  font-size:10.5px;color:#A8A28D;cursor:pointer;font-weight:700;position:relative;user-select:none;
  transition:color .2s;
}
.tabbar .tab svg{width:23px;height:23px;fill:#B4AE99;transition:transform .28s var(--ease),fill .2s;}
.tabbar .tab.active{color:var(--ink);}
.tabbar .tab.active svg{fill:var(--yellow-deep);transform:translateY(-2px);}
.tabbar .tab.active::after{content:"";position:absolute;top:0;width:18px;height:3px;border-radius:0 0 4px 4px;background:var(--yellow);animation:tabdot .3s var(--ease) both;}
@keyframes tabdot{from{transform:scaleX(0);}to{transform:scaleX(1);}}
.tabbar .tab.bump svg{animation:bump .4s var(--ease);}
@keyframes bump{0%{transform:scale(1);}40%{transform:scale(1.28) translateY(-3px);}100%{transform:scale(1) translateY(-2px);}}

/* Modal */
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px 14px;visibility:hidden;pointer-events:none;}
.modal.show{visibility:visible;pointer-events:auto;}
.modal-mask{position:absolute;inset:0;background:rgba(24,21,12,.55);opacity:0;transition:opacity .3s ease;}
.modal.show .modal-mask{opacity:1;}
.modal-box{position:relative;width:100%;max-width:460px;max-height:84vh;background:var(--card);border-radius:20px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden;transform:translateY(26px) scale(.95);opacity:0;transition:transform .34s var(--ease),opacity .3s var(--ease);}
.modal.show .modal-box{transform:none;opacity:1;}
.modal-head{flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;padding:15px 16px 12px;border-bottom:1px solid var(--line);}
.modal-head .t{flex:1;min-width:0;}
.modal-title{font-size:17px;font-weight:800;line-height:1.3;word-break:break-all;}
.modal-title mark{background:linear-gradient(transparent 55%,#FFE066 55%);color:inherit;padding:0 2px;border-radius:3px;}
.modal-head .badge{margin-top:5px;}
.modal-close{flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:none;background:#F0E9DA;color:#6B6655;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .18s var(--ease);}
.modal-close:active{transform:scale(.88);}
.modal-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 20px;}

/* To top */
#toTop{
  position:fixed;right:14px;bottom:88px;z-index:28;width:44px;height:44px;border-radius:50%;
  background:var(--ink);color:var(--yellow);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 20px rgba(26,26,26,.35);
  opacity:0;transform:translateY(16px) scale(.8);pointer-events:none;
  transition:opacity .3s ease,transform .3s var(--ease);
}
#toTop.show{opacity:1;transform:none;pointer-events:auto;}
#toTop:active{transform:scale(.9);}
#toTop svg{width:20px;height:20px;fill:var(--yellow);}

.hidden{display:none!important;}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;}
}
</style>
</head>
<body>

<div class="bg-glow" aria-hidden="true"></div>

<header class="header">
  <div class="header-top">
    <div class="logo">N</div>
    <div>
      <h1>挪瓦咖啡</h1>
      <div class="sub">饮品制作 SOP 查询工具</div>
    </div>
  </div>
</header>

<div class="search">
  <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
  <input id="search" type="text" placeholder="搜索饮品名称，如 生椰拿铁" autocomplete="off">
  <button class="clean-btn" id="cleanBtn" aria-label="清空">✕</button>
</div>

<div class="filter">
  <div class="f-row">
    <span class="f-label">品类</span>
    <div class="chips scroll-mask" id="chips-series"></div>
  </div>
  <div class="f-row">
    <span class="f-label">杯型</span>
    <div class="chips" id="chips-cup"></div>
  </div>
  <div class="f-row">
    <span class="f-label">冷热</span>
    <div class="chips" id="chips-temp"></div>
  </div>
</div>

<main class="main">
  <section id="tab-drinks">
    <div class="result-bar">
      <span class="cnt">共 <b id="resultCount">0</b> 款饮品<span id="matchInfo"></span></span>
      <div class="col-switch" id="colSwitch" role="group" aria-label="切换宫格列数">
        <button data-cols="2">2列</button><button data-cols="3">3列</button><button data-cols="4">4列</button>
      </div>
    </div>
    <div id="drinks"></div>
    <div id="empty" class="empty hidden">
      <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm4.7 12.3-1.4 1.4L12 12.4l-3.3 3.3-1.4-1.4L10.6 11 7.3 7.7l1.4-1.4L12 9.6l3.3-3.3 1.4 1.4L13.4 11z"/></svg>
      <div class="t">未找到匹配的饮品</div>
      <div class="d">试试更换关键词，或清除筛选条件</div>
      <button id="resetBtn">清除所有筛选</button>
    </div>
  </section>
  <section id="tab-material" class="hidden">
    <div class="sec-title">原物料认知</div>
    <div id="materials"></div>
  </section>
  <section id="tab-terms" class="hidden">
    <div class="sec-title">SOP 用词认知</div>
    <div id="terms"></div>
  </section>
  <section id="tab-buttons" class="hidden">
    <div class="sec-title">咖啡新旧按键对应关系</div>
    <div id="buttons"></div>
  </section>
  <section id="tab-tools" class="hidden">
    <div class="sec-title">制作产品所需小器具</div>
    <div id="tools"></div>
  </section>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-mask" data-close></div>
  <div class="modal-box">
    <div class="modal-head">
      <div class="t"><div class="modal-title" id="modalTitle"></div><div id="modalBadge"></div></div>
      <button class="modal-close" id="modalClose" aria-label="关闭">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<nav class="tabbar" id="tabbar">
  <div class="tab active" data-tab="drinks">
    <svg viewBox="0 0 24 24"><path d="M18 8h1a1 1 0 0 1 1 1v1H4V9a1 1 0 0 1 1-1h1V7a6 6 0 0 1 12 0v1zm-2 0V7a4 4 0 0 0-8 0v1h8zM4 12h16v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-7z"/></svg>
    饮品
  </div>
  <div class="tab" data-tab="material">
    <svg viewBox="0 0 24 24"><path d="M4 3h16a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm0 7h7v10H5a1 1 0 0 1-1-1V10zm9 0h7v9a1 1 0 0 1-1 1h-6V10z"/></svg>
    原物料
  </div>
  <div class="tab" data-tab="terms">
    <svg viewBox="0 0 24 24"><path d="M4 4h16a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm3 5v2h10V9H7zm0 4v2h10v-2H7z"/></svg>
    术语
  </div>
  <div class="tab" data-tab="buttons">
    <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm-1 14v-4h2v4zm0-6V7h2v3z"/></svg>
    按键
  </div>
  <div class="tab" data-tab="tools">
    <svg viewBox="0 0 24 24"><path d="M21.7 6.3a1 1 0 0 0-1.4 0l-4.6 4.6-1.6-1.6 4.6-4.6a1 1 0 0 0 0-1.4 7 7 0 0 0-9.9 0L7.3 4.8 3 9l.7.7 3.3-3.3 1.4 1.4L5 11.2l.7.7 3.4-3.4 1.6 1.6-3.4 3.4.7.7 3.4-3.4 1.6 1.6-3.3 3.3.7.7 4.2-4.3 1.5 1.5a7 7 0 0 0 0-9.9z"/></svg>
    器具

const DRINKS = [].concat(DATA.longterm, DATA.season, DATA.retire, DATA.oldLongterm, DATA.oldSeason);
const SERIES = ["美式/果咖系列","拿铁系列","非咖系列","当季新品","汰换品","旧版长期品","旧版当季品"];
const SERIES_LABEL = {"美式/果咖系列":"美式果咖","拿铁系列":"拿铁","非咖系列":"非咖","当季新品":"当季新品","汰换品":"汰换品","旧版长期品":"旧版长期品","旧版当季品":"旧版当季品"};
const CUPS = ["标准杯","吨吨桶","超大杯"];
const TEMPS = ["冰","热"];

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(v){if(v===null||v===undefined||v==='')return '—';return String(parseFloat(v));}

function badgeOf(series){
  if(series==="当季新品") return '<span class="badge new">新品</span>';
  if(series==="汰换品") return '<span class="badge retire">售完即止</span>';
  if(series==="旧版长期品"||series==="旧版当季品") return '<span class="badge retire">旧版</span>';
  return '<span class="badge">'+SERIES_LABEL[series]+'</span>';
}

function splitSteps(s){
  const steps=[];let buf='';let depth=0;
  for(let i=0;i<s.length;i++){
    const ch=s[i];
    if(ch==='（'||ch==='('){depth++;buf+=ch;}
    else if(ch==='）'||ch===')'){depth=Math.max(0,depth-1);buf+=ch;}
    else if(ch==='+'&&depth===0){const t=buf.trim();if(t)steps.push(t);buf='';}
    else{buf+=ch;}
  }
  const t=buf.trim();if(t)steps.push(t);
  return steps;
}

function tagOf(temp){return temp==='热'?'<span class="tag hot">热</span>':'<span class="tag ice">冰</span>';}
function cupIco(cup){
  if(cup.indexOf('吨吨')>-1) return '<span style="font-size:11px">🧋</span>';
  if(cup.indexOf('超大')>-1) return '<span style="font-size:11px">🥤</span>';
  return '<span style="font-size:11px">☕</span>';
}

function specHTML(spec){
  const steps = splitSteps(spec.step).map((st,i)=>'<li data-i="'+(i+1)+'">'+esc(st)+'</li>').join('');
  return '<div class="spec">'+
    '<div class="spec-top"><span class="cup">'+cupIco(spec.cup)+esc(spec.cup)+'</span>'+tagOf(spec.temp)+'</div>'+
    '<ol class="steps">'+steps+'</ol>'+
  '</div>';
}

function ctagT(t){
  const cls = t==='热'?'ctag hot':'ctag ice';
  return '<span class="'+cls+'">'+esc(t)+'</span>';
}

let hlKw='';
function hl(s){
  if(!hlKw) return esc(s);
  return esc(s).split(hlKw).join('<mark>'+esc(hlKw)+'</mark>');
}

function productCard(p, idx){
  const cups = [...new Set(p.specs.map(s=>s.cup))].join(' / ');
  const temps = [...new Set(p.specs.map(s=>s.temp))];
  const tempTags = temps.map(ctagT).join('');
  return '<div class="card" data-idx="'+idx+'" role="button" tabindex="0" aria-label="查看 '+esc(p.name)+' 的制作步骤">'+
    '<div class="card-title">'+hl(p.name)+'</div>'+
    '<div class="card-tags">'+badgeOf(p.series)+'</div>'+
    '<div class="card-sub"><span class="cups">'+esc(cups)+'</span><span class="temps">'+tempTags+'</span></div>'+
  '</div>';
}

let curSeries='全部', curCup='全部', curTemp='全部', curKeyword='', renderedList=[];

function renderChips(){
  const seriesChips = ['全部'].concat(SERIES).map(c=>
    '<div class="chip'+(curSeries===c?' active':'')+'" data-f="'+esc(c)+'">'+(c==='全部'?'全部':SERIES_LABEL[c])+'</div>').join('');
  document.getElementById('chips-series').innerHTML = seriesChips;
  const cupChips = ['全部'].concat(CUPS).map(c=>
    '<div class="chip'+(curCup===c?' active':'')+'" data-cup="'+esc(c)+'">'+c+'</div>').join('');
  document.getElementById('chips-cup').innerHTML = cupChips;
  const tempChips = ['全部'].concat(TEMPS).map(c=>
    '<div class="chip'+(curTemp===c?' active':'')+'" data-temp="'+esc(c)+'">'+c+'</div>').join('');
  document.getElementById('chips-temp').innerHTML = tempChips;
}

function renderDrinks(){
  const kws = curKeyword.split(/\s+/).filter(Boolean);
  hlKw = kws.length ? kws.slice().sort((a,b)=>b.length-a.length)[0] : '';
  const list = [];
  DRINKS.forEach(p=>{
    if(curSeries!=='全部' && p.series!==curSeries) return;
    if(kws.length){
      const name=p.name.toLowerCase();
      if(!kws.every(k=>name.indexOf(k)!==-1)) return;
    }
    const specs = p.specs.filter(s=>{
      if(curCup!=='全部' && s.cup!==curCup) return false;
      if(curTemp!=='全部' && s.temp!==curTemp) return false;
      return true;
    });
    if(specs.length===0) return;
    list.push({name:p.name, series:p.series, specs:specs});
  });
  renderedList = list;
  const wrap = document.getElementById('drinks');
  wrap.innerHTML = list.map((p,i)=>productCard(p,i)).join('');
  applyCols();
  document.getElementById('resultCount').textContent = list.length;
  document.getElementById('matchInfo').textContent = '';
  const total = DRINKS.length;
  const hasFilter = curSeries!=='全部'||curCup!=='全部'||curTemp!=='全部'||curKeyword!=='';
  if(hasFilter && list.length>0 && list.length<total){
    document.getElementById('matchInfo').textContent = '（匹配 '+list.length+'/'+total+'）';
  }
  const empty = document.getElementById('empty');
  empty.classList.toggle('hidden', list.length>0);
  if(list.length>0) observeCards();
}

      ['开封前', (m.preEnv+' · '+m.preTime).replace(/^ · | · $/g,'')],
      ['开封后', (m.postEnv+' · '+m.postTime).replace(/^ · | · $/g,'')],
    ].filter(f=>f[1] && f[1]!=='/');
    return '<div class="row">'+
      '<div class="row-name">'+esc(m.name)+'<span class="tag ice">'+esc(m.type)+'</span></div>'+
      '<div class="kv">'+fields.map(f=>'<span><b>'+f[0]+'</b>'+esc(f[1])+'</span>').join('')+'</div>'+
    '</div>';
  }).join('');
}

let io;
function observeCards(){
  if(!('IntersectionObserver' in window)){ document.querySelectorAll('#drinks .card').forEach(c=>c.classList.add('in')); return; }
  if(io) io.disconnect();
  io = new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); }
    });
  },{rootMargin:'0px 0px -8% 0px'});
  document.querySelectorAll('#drinks .card:not(.in)').forEach(c=>io.observe(c));
}

function ripple(e){
  const chip = e.target.closest('.chip');
  if(!chip) return;
  const rect = chip.getBoundingClientRect();
  const d = Math.max(rect.width, rect.height);
  const r = document.createElement('span');
  r.className = 'ripple';
  r.style.width = r.style.height = d+'px';
  r.style.left = (e.clientX - rect.left - d/2)+'px';
  r.style.top = (e.clientY - rect.top - d/2)+'px';
  chip.appendChild(r);
  setTimeout(()=>r.remove(), 560);
}

function switchTab(tab){
  ['drinks','material','terms','buttons','tools'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('hidden', t!==tab);
  });
  document.querySelectorAll('#tabbar .tab').forEach(el=>{
    const act = el.dataset.tab===tab;
    el.classList.toggle('active', act);
    if(act) el.classList.add('bump');
    else el.classList.remove('bump');
  });
  const isDrinks = tab==='drinks';
  document.querySelector('.search').style.display = isDrinks?'flex':'none';
  document.querySelector('.filter').style.display = isDrinks?'block':'none';
  if(!isDrinks && typeof renderedLazy==='undefined'){
    renderedLazy = {};
    ['materials','terms','buttons','tools'].forEach(k=>renderedLazy[k]=false);
  }
  if(!isDrinks && !renderedLazy[tab]){ renderedLazy[tab]=true; (tab==='material'?renderMaterials():tab==='terms'?renderTerms():tab==='buttons'?renderButtons():renderTools()); }
  window.scrollTo({top:0,behavior:'auto'});
}
let renderedLazy;

/* event bindings */
const searchInput = document.getElementById('search');
let searchTimer=null;
searchInput.addEventListener('input', function(e){
  const val = e.target.value;
  document.getElementById('cleanBtn').classList.toggle('show', !!val);
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>{
    curKeyword = val.trim().toLowerCase();
    renderDrinks();
  }, 120);
});

document.getElementById('cleanBtn').addEventListener('click', function(){
  searchInput.value='';
  this.classList.remove('show');
  curKeyword='';
  renderDrinks();
  searchInput.focus();
});

document.getElementById('chips-series').addEventListener('click', function(e){
  ripple(e); const chip=e.target.closest('.chip'); if(!chip) return;
  curSeries = chip.dataset.f; renderChips(); renderDrinks();
});
document.getElementById('chips-cup').addEventListener('click', function(e){
  ripple(e); const chip=e.target.closest('.chip'); if(!chip) return;
  curCup = chip.dataset.cup; renderChips(); renderDrinks();
});
document.getElementById('chips-temp').addEventListener('click', function(e){
  ripple(e); const chip=e.target.closest('.chip'); if(!chip) return;
  curTemp = chip.dataset.temp; renderChips(); renderDrinks();
});

document.getElementById('drinks').addEventListener('click', function(e){
  const card = e.target.closest('.card');
  if(!card) return;
  openDrink(+card.dataset.idx);
});
document.getElementById('drinks').addEventListener('keydown', function(e){
  if(e.key==='Enter'||e.key===' '){
    const card = e.target.closest('.card');
    if(card){ e.preventDefault(); openDrink(+card.dataset.idx); }
  }
});

document.getElementById('resetBtn').addEventListener('click', function(){
  curSeries='全部'; curCup='全部'; curTemp='全部'; curKeyword='';
  searchInput.value=''; document.getElementById('cleanBtn').classList.remove('show');
  renderChips(); renderDrinks();
});

document.getElementById('tabbar').addEventListener('click', function(e){
  const tab = e.target.closest('.tab');
  if(!tab) return;
  switchTab(tab.dataset.tab);
});

/* ---- modal ---- */
const modal = document.getElementById('modal');
const modalBodyEl = document.getElementById('modalBody');

function openDrink(idx){
  const p = renderedList[idx];
  if(!p) return;
  document.getElementById('modalTitle').innerHTML = hl(p.name);
  document.getElementById('modalBadge').innerHTML = badgeOf(p.series);
  modalBodyEl.innerHTML = p.specs.map(specHTML).join('');
  modalBodyEl.scrollTop = 0;
  modal.classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  modal.classList.remove('show');
  document.body.style.overflow = '';
}
document.getElementById('modalClose').addEventListener('click', closeModal);
modal.querySelector('.modal-mask').addEventListener('click', closeModal);
document.addEventListener('keydown', function(e){
  if(e.key==='Escape') closeModal();
});

/* ---- grid columns preference (remembered locally) ---- */
const LS_COLS = 'nowacoffee_cols';
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function defaultCols(){ const w = window.innerWidth; return w>=900?4: w>=600?3:2; }
let cols = (function(){
  const v = parseInt(lsGet(LS_COLS), 10);
  return (v===2||v===3||v===4) ? v : defaultCols();
})();
function applyCols(){
  document.getElementById('drinks').style.setProperty('--cols', cols);
  document.querySelectorAll('#colSwitch button').forEach(b=>b.classList.toggle('active', +b.dataset.cols===cols));
}
document.getElementById('colSwitch').addEventListener('click', function(e){
  const b = e.target.closest('button');
  if(!b || +b.dataset.cols===cols) return;
  cols = +b.dataset.cols;
  lsSet(LS_COLS, String(cols));
  applyCols();
});

const toTopBtn = document.getElementById('toTop');
let ticking=false;
window.addEventListener('scroll', function(){
  if(ticking) return;
  ticking=true;
  requestAnimationFrame(()=>{
    toTopBtn.classList.toggle('show', window.scrollY>480);
    ticking=false;
  });
},{passive:true});
toTopBtn.addEventListener('click', function(){
  window.scrollTo({top:0, behavior:'smooth'});
});

renderChips();
renderDrinks();
applyCols();
</script>
